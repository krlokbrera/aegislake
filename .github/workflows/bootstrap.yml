name: Bootstrap and verify AegisLake
on:
  push:
    branches: [feature/identity-analytics]
    paths: [aegislake-source.json, .github/workflows/bootstrap.yml]
permissions:
  contents: write
concurrency:
  group: aegislake-bootstrap
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Restore reviewed source files
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path.cwd().resolve()
          files = json.loads((root / "aegislake-source.json").read_text(encoding="utf-8"))
          for name, content in files.items():
              path = root / name
              if name.startswith("-") or ".git" in path.parts or not path.resolve().is_relative_to(root):
                  raise ValueError("unsafe source path")
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")
          PY
      - name: Publish implementation on the development branch
        run: |
          python - <<'PY'
          import json, subprocess
          files = json.load(open("aegislake-source.json", encoding="utf-8"))
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "--", *files.keys()], check=True)
          if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode:
              subprocess.run(["git", "commit", "-m", "Implement identity analytics pipeline, tests and research"], check=True)
              subprocess.run(["git", "push", "origin", "HEAD:feature/identity-analytics"], check=True)
          PY
      - name: Install isolated dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/python -m pip install ".[dev,azure]"
      - name: Lint
        run: .venv/bin/ruff check src tests scripts
      - name: Run regression and end-to-end tests
        run: .venv/bin/pytest --cov=aegislake --cov-report=term-missing --cov-report=xml --junitxml=/tmp/aegislake-tests.xml
      - name: Audit resolved dependencies
        run: .venv/bin/pip-audit --progress-spinner off
      - name: Run default synthetic demonstration
        run: |
          .venv/bin/aegislake demo --output runs
          .venv/bin/python -m pip freeze > runs/environment.txt
      - name: Compile Azure infrastructure
        run: az bicep build --file infra/main.bicep --stdout > /tmp/aegislake-template.json
      - name: Build non-root image
        run: docker build --tag aegislake:verified .
      - name: Run non-root container smoke test
        run: docker run --rm aegislake:verified demo --days 15 --users 12 --train-days 9 --validation-days 3
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aegislake-verification
          path: |
            runs/**/report.html
            runs/**/report.json
            runs/**/manifest.json
            runs/environment.txt
            coverage.xml
            /tmp/aegislake-tests.xml
          retention-days: 14
      - name: Record verified evidence and remove temporary bootstrap
        run: |
          .venv/bin/python - <<'PY'
          import json, os, pathlib, shutil, subprocess, xml.etree.ElementTree as ET
          root = pathlib.Path.cwd()
          source_paths = list(json.loads((root / "aegislake-source.json").read_text(encoding="utf-8")))
          run_url = "https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
          suite = ET.parse("/tmp/aegislake-tests.xml").getroot()
          tests = sum(int(node.get("tests", 0)) for node in suite.findall("testsuite"))
          coverage = ET.parse("coverage.xml").getroot().get("line-rate")
          percent = round(float(coverage) * 100)
          status = f"""# Validation status and evidence ledger

          Verified on 2026-10-31 in an isolated GitHub Actions Python 3.12 Linux environment.

          Evidence: [{run_url}]({run_url})

          | Check | Observed result |
          | --- | --- |
          | Python regression and end-to-end tests | {tests} passed |
          | Coverage | {percent}% of measured statements; CLI excluded |
          | Ruff | Passed |
          | Dependency audit | No known vulnerabilities reported for the resolved environment |
          | Default synthetic demo | Completed; report and manifest archived |
          | Azure Bicep compilation | Passed without deployment |
          | Docker build | Passed |
          | Non-root container demo | Completed |
          | Python 3.11/3.12 CI matrix | See the PR checks for the latest head |
          | Real-data effectiveness | Not validated |
          | Azure student credit and live deployment | Not verified; no Azure resources created |

          A separate CI run initially identified vulnerable preinstalled setuptools in the Python 3.11 runner. CI now creates a virtual environment and upgrades packaging tools before installing and auditing project dependencies.

          The exact Python 3.12 reference environment is stored in requirements-verified-py312-linux.txt. This is an environment snapshot, not a hash-locked cross-platform dependency specification. Original project code is installed separately.

          The generated examples/demo report contains synthetic data only. Its scores describe the simulator, not real-world effectiveness. The manifest refers to full run artifacts retained by CI or reproducible locally.

          Remaining review: authorized real-data backtesting, campaign-level metrics and uncertainty, a signed model/artifact registry, hash-locked production dependencies, and live Azure for Students access/cost verification.
          """
          # Keep Markdown at column zero while preserving its paragraph structure.
          status = "\n".join(line[10:] if line.startswith("          ") else line for line in status.splitlines()) + "\n"
          (root / "docs/VALIDATION_STATUS.md").write_text(status, encoding="utf-8")
          readme_path = root / "README.md"
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace(
              "> Status: implementation prepared; automated checks and Azure deployment must be verified in the target environment. No real-world effectiveness figures are claimed. The default demo is entirely synthetic.",
              f"> Verified synthetic demo: {tests} tests pass with {percent}% measured coverage; dependency audit, Bicep build, and non-root Docker execution pass. [Execution evidence]({run_url}). Live Azure deployment remains pending.")
          readme = readme.replace(
              "## What is still required before claiming completion",
              "## Verification evidence and remaining scope")
          readme = readme.replace(
              "Read [VALIDATION_STATUS.md](docs/VALIDATION_STATUS.md). Green CI must be observed, the resolved dependency environment must be archived, and Azure deployment must be verified against an active Azure for Students subscription. A source upload is not evidence of a successful cloud deployment.",
              "Read [VALIDATION_STATUS.md](docs/VALIDATION_STATUS.md) for observed checks and remaining limits. [A generated synthetic report](examples/demo/report.html), its JSON metrics and manifest are included for inspection. Azure student access and live deployment are pending.")
          readme_path.write_text(readme, encoding="utf-8")
          frozen = subprocess.check_output([".venv/bin/python", "-m", "pip", "freeze", "--exclude", "aegislake"], text=True)
          (root / "requirements-verified-py312-linux.txt").write_text(
              "# Verified Python 3.12 Linux environment snapshot; install the project separately.\n" + frozen, encoding="utf-8")
          report_dir = next(path.parent for path in (root / "runs").glob("*/report.json"))
          example_dir = root / "examples/demo"
          example_dir.mkdir(parents=True, exist_ok=True)
          for name in ("report.html", "report.json", "manifest.json"):
              shutil.copyfile(report_dir / name, example_dir / name)
          (root / "aegislake-source.json").unlink()
          (root / ".github/workflows/bootstrap.yml").unlink()
          subprocess.run(["git", "add", "--", *source_paths, "requirements-verified-py312-linux.txt", "examples/demo", "aegislake-source.json", ".github/workflows/bootstrap.yml"], check=True)
          subprocess.run(["git", "commit", "-m", "Record verified demo and remove temporary bootstrap"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:feature/identity-analytics"], check=True)
          PY
