name: Verify connected SOC dashboards release
on:
  push:
    paths:
      - .github/workflows/bootstrap-dashboards.yml
      - aegislake-dashboard-source.json
permissions:
  contents: write
concurrency:
  group: connected-dashboard-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize approved source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path.cwd().resolve()
          for relative, text in json.loads(Path('aegislake-dashboard-source.json').read_text()).items():
              target = (root / relative).resolve()
              if not target.is_relative_to(root) or '.git' in target.relative_to(root).parts:
                  raise ValueError('invalid source path')
              target.parent.mkdir(parents=True, exist_ok=True)
              if relative == '.github/workflows/ci.yml':
                  if target.read_text(encoding='utf-8') != text:
                      raise ValueError('approve the CI artifact configuration on the branch first')
                  continue
              target.write_text(text, encoding='utf-8')
          PY
      - name: Install isolated environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/python -m pip install '.[dev,azure]'
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint and complete regression suite
        run: |
          ruff check src tests scripts
          pytest --cov=aegislake --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
      - name: Dependency audit
        run: pip-audit --progress-spinner off
      - name: Generate reproducible inspection bundle
        run: aegislake demo --seed 7 --output runs
      - name: Compile infrastructure without deploying
        run: az bicep build --file infra/main.bicep --stdout > /tmp/aegislake-template.json
      - name: Build and execute non-root container
        run: |
          docker build --tag aegislake:dashboards .
          docker run --rm aegislake:dashboards demo --days 15 --users 12 --train-days 9 --validation-days 3
      - name: Record measured evidence and remove staging
        env:
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, re, shutil, subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path
          candidates = [p.parent for p in Path('runs').glob('*/manifest.json')]
          if len(candidates) != 1:
              raise ValueError('expected one completed demo run')
          run = candidates[0]
          example = Path('examples/demo')
          example.mkdir(exist_ok=True)
          for name in ('report.html','mitre.html','dashboard.html','dashboard.json','report.json',
                       'manifest.json','attack-mapping.json','dettect-techniques.yaml','quality.json'):
              shutil.copyfile(run/name, example/name)
          shutil.copyfile(run/'gold/alerts.json', example/'alerts.json')
          (example/'README.md').write_text('# Synthetic inspection bundle\n\nGenerated with release 0.2.0 and seed 7. '
              'Open report.html, dashboard.html or mitre.html. This subset omits bronze/silver/features and '
              'is not a scoring reference. Its manifest describes the complete run.\n', encoding='utf-8')
          suite = ET.parse('test-results.xml').getroot().find('testsuite')
          if suite is None or int(suite.attrib['failures']) or int(suite.attrib['errors']):
              raise ValueError('release tests are not green')
          count = int(suite.attrib['tests'])
          coverage = float(ET.parse('coverage.xml').getroot().attrib['line-rate'])
          evidence = os.environ['EVIDENCE_URL']
          headline = f'> Verified dashboard release 0.2.0: {count} tests pass with {coverage:.0%} measured Python coverage. [Release evidence]({evidence}).'
          readme = Path('README.md')
          content = re.sub(r'^> Interactive dashboard release 0.2.0:.*$', headline, readme.read_text(), flags=re.M)
          content = re.sub(r'^> GitHub Actions validation for this release is pending publication;.*\n?', '', content, flags=re.M)
          readme.write_text(content, encoding='utf-8')
          ledger = f'''# Validation status and evidence ledger
          
          Release 0.2.0 verified in an isolated Python 3.12 Linux environment.
          Evidence: {evidence}
          
          | Check | Observed result |
          | --- | --- |
          | Regression, HTTP isolation and scoring tests | {count} passed |
          | Python statement coverage | {coverage:.0%}; CLI excluded |
          | Ruff | Passed |
          | Dependency audit | No known vulnerabilities reported for the resolved environment |
          | Fresh seed-7 example | Completed; native dashboard, Overview, MITRE and exports generated |
          | Bicep compilation | Passed without deploying |
          | Non-root Docker build and execution | Passed |
          | Python 3.11/3.12 permanent CI | Inspect final-source PR checks |
          | Browser validation and remaining visual checks | See FRONTEND_REVIEW_ES.md |
          | Real SIEM connection / live Azure deployment | Not performed |
          
          requirements-verified-py312-linux.txt records the resolved release environment. It is not a
          hash-locked production specification. requirements-verified-py311-windows.txt records local QA.
          The inspection bundle is synthetic and omits some files described by its complete-run manifest.
          Alert counts and ranking scores do not establish operational detection coverage. DeTT&CT scores
          remain an unassessed draft. See DASHBOARDS_ES.md and DETTCT_ES.md for scope and limits.
          '''
          Path('docs/VALIDATION_STATUS.md').write_text(ledger, encoding='utf-8')
          environment = subprocess.check_output(['python','-m','pip','freeze'], text=True)
          environment = '\n'.join(line for line in environment.splitlines() if not line.lower().startswith('aegislake'))+'\n'
          Path('requirements-verified-py312-linux.txt').write_text(environment, encoding='utf-8')
          Path('aegislake-dashboard-source.json').unlink()
          Path('.github/workflows/bootstrap-dashboards.yml').unlink()
          PY
      - name: Archive synthetic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connected-dashboard-release-evidence
          path: |
            examples/demo
            coverage.xml
            test-results.xml
            requirements-verified-py312-linux.txt
          retention-days: 14
          if-no-files-found: error
      - name: Commit verified source and synthetic example
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs examples pyproject.toml README.md .gitignore requirements-verified-py312-linux.txt requirements-verified-py311-windows.txt .github/workflows/ci.yml
          git add -u -- aegislake-dashboard-source.json .github/workflows/bootstrap-dashboards.yml
          git commit -m 'Add connected native SOC dashboards and verified batch exploration'
          git push origin HEAD:${{ github.ref_name }}
